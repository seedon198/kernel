<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 617" width="880" height="617" role="img" aria-label="Interrupt and exception dispatch path"><title>Interrupt and exception dispatch path</title><rect width="880" height="617" rx="12" fill="#0f1218"/><rect x="24" y="24" width="832" height="65" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6e9ef" text-anchor="start">CPU raises vector V</text><text x="836" y="51" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">hardware</text><text x="60" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">pushes SS, RSP, RFLAGS, CS, RIP, plus an error code for some vectors</text><line x1="64" y1="89" x2="64" y2="122" stroke="#7fa6e8" stroke-width="1.6"/><polygon points="59,121 69,121 64,129" fill="#7fa6e8"/><rect x="24" y="129" width="832" height="86" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6e9ef" text-anchor="start">vector_stub_V</text><text x="836" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">generated asm, one per vector</text><text x="60" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">push 0</text><text x="123.5" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">as a dummy error code if the CPU did not push one</text><text x="60" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">push V</text><text x="123.5" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">then jmp common_stub</text><line x1="64" y1="215" x2="64" y2="248" stroke="#7fa6e8" stroke-width="1.6"/><polygon points="59,247 69,247 64,255" fill="#7fa6e8"/><rect x="24" y="255" width="832" height="107" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6e9ef" text-anchor="start">common_stub</text><text x="836" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">one shared asm routine</text><text x="60" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">push 15 GPRs</text><text x="167.0" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">the stack now holds a full TrapFrame</text><text x="60" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="327" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">rdi = rsp</text><text x="145.25" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">(&amp;mut TrapFrame), align rsp to 16 bytes, call idt_dispatch</text><text x="60" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">on return</text><text x="145.25" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">restore GPRs, drop vector and error code, iretq</text><line x1="64" y1="362" x2="64" y2="395" stroke="#7fa6e8" stroke-width="1.6"/><polygon points="59,394 69,394 64,402" fill="#7fa6e8"/><rect x="24" y="402" width="832" height="86" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="429" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6e9ef" text-anchor="start">idt_dispatch(&amp;mut TrapFrame)</text><text x="836" y="429" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">Rust · hal::idt</text><text x="60" y="453" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="453" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">HANDLERS[vector]</text><text x="196.0" y="453" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">set: call it</text><text x="60" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">otherwise</text><text x="145.25" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">default_exception() prints a diagnostic report</text><line x1="64" y1="488" x2="64" y2="521" stroke="#7fa6e8" stroke-width="1.6"/><polygon points="59,520 69,520 64,528" fill="#7fa6e8"/><text x="80" y="512" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#7fa6e8" text-anchor="start">handler returns</text><rect x="24" y="528" width="832" height="65" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="555" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6e9ef" text-anchor="start">iretq</text><text x="836" y="555" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">back in common_stub</text><text x="60" y="579" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="579" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">registers restored from the TrapFrame; the interrupted code resumes</text></svg>
