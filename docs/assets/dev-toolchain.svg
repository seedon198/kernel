<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 362" width="880" height="362" role="img" aria-label="Magnetite toolchain: Rust crates to kernel ELF to ISO to QEMU"><title>Magnetite toolchain: Rust crates to kernel ELF to ISO to QEMU</title><rect width="880" height="362" rx="12" fill="#0f1218"/><rect x="24" y="24" width="832" height="36" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6e9ef" text-anchor="start">Rust crates</text><text x="836" y="51" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">kernel, hal, libs/*</text><line x1="64" y1="60" x2="64" y2="93" stroke="#7fa6e8" stroke-width="1.6"/><polygon points="59,92 69,92 64,100" fill="#7fa6e8"/><text x="80" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#7fa6e8" text-anchor="start">cargo build --target x86_64-unknown-none</text><rect x="24" y="100" width="832" height="36" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6e9ef" text-anchor="start">kernel ELF</text><text x="836" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">higher-half PIE</text><line x1="64" y1="136" x2="64" y2="169" stroke="#7fa6e8" stroke-width="1.6"/><polygon points="59,168 69,168 64,176" fill="#7fa6e8"/><text x="80" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#7fa6e8" text-anchor="start">cargo xtask iso   (Limine + xorriso)</text><rect x="24" y="176" width="832" height="36" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6e9ef" text-anchor="start">kernel.iso</text><text x="836" y="203" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">boots under UEFI and BIOS</text><line x1="64" y1="212" x2="64" y2="245" stroke="#7fa6e8" stroke-width="1.6"/><polygon points="59,244 69,244 64,252" fill="#7fa6e8"/><text x="80" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#7fa6e8" text-anchor="start">cargo xtask run</text><rect x="24" y="252" width="832" height="86" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="279" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6e9ef" text-anchor="start">qemu-system-x86_64</text><text x="836" y="279" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">q35 · OVMF for UEFI</text><text x="60" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="303" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">serial</text><text x="123.5" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">output goes straight to your terminal</text><text x="60" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">:1234</text><text x="116.25" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">GDB stub with cargo xtask debug, for gdb or lldb</text></svg>
