<text x="22" y="642" xml:space="preserve"><tspan fill="#7fb88a">[INFO]  </tspan><tspan fill="#c9d1dc">invoke: retype-&gt;frame, identify, rights-denied, and signal all behaved correctly</tspan></text>
<text x="22" y="661" xml:space="preserve"><tspan fill="#6b7484">       ⋮</tspan></text>
<text x="22" y="680" xml:space="preserve"><tspan fill="#7fb88a">[INFO]  </tspan><tspan fill="#c9d1dc">sched: both threads ran via context switch (A=3, B=3)</tspan></text>
<text x="22" y="699" xml:space="preserve"><tspan fill="#6b7484">       ⋮</tspan></text>
