<text x="22" y="737" xml:space="preserve"><tspan fill="#6b7484">       ⋮</tspan></text>
<text x="22" y="756" xml:space="preserve"><tspan fill="#7fb88a">[INFO]  </tspan><tspan fill="#c9d1dc">lapic: timer calibrated against the PIT: 62481 ticks/ms (div 16); periodic 100 Hz, count 624810, vector 0x30</tspan></text>
