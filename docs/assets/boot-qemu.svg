<text x="22" y="794" xml:space="preserve"><tspan fill="#7fb88a">[INFO]  </tspan><tspan fill="#c9d1dc">preempt: both spinners finished, time-sliced by the timer (C=404649, D=373825; 25 preemptions in 25 ticks)</tspan></text>
<text x="22" y="813" xml:space="preserve"><tspan fill="#6b7484">       ⋮</tspan></text>
<text x="22" y="832" xml:space="preserve"><tspan fill="#7fb88a">[INFO]  </tspan><tspan fill="#c9d1dc">ready: W^X+NX verified, smep=true smap=true, kaslr slide=0x66fc0000, guard pages, preemptive scheduling</tspan></text>
<text x="22" y="851" xml:space="preserve"><tspan fill="#7fb88a">[INFO]  </tspan><tspan fill="#c9d1dc">kernel: idling (timer running; no user tasks yet)</tspan></text>
