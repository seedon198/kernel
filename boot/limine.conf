# Limine bootloader configuration. Placed at /boot/limine/limine.conf on the ISO.
# See docs/adr/0003-bootloader.md.

# Boot immediately; this is a single-purpose image.
timeout: 0

/kernel
    # Boot our kernel with the Limine boot protocol.
    protocol: limine

    # boot():/ is the partition that holds this config.
    kernel_path: boot():/boot/kernel
