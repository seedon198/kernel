# cargo-deny configuration — supply-chain policy (ADR 0007, threat model).
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# RUSTSEC advisory database. Fail on any vulnerable or yanked dependency.
version = 2
yanked = "deny"

[licenses]
version = 2
# We are MIT; accept only permissive, well-understood licenses for deps.
# Add to this list deliberately, with justification in the PR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Keep the dependency tree small and auditable (minimal-TCB principle).
multiple-versions = "warn"
# Deny wildcard (versionless) dependencies from registries, but allow our own
# intra-workspace `{ path = ... }` crates, which legitimately carry no version.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no unvetted git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
